# Generated by get-it-done.deployment/tools/sync-applications.mjs
name: Build UAT and request deployment
on:
  push:
    branches: [UAT]
permissions:
  contents: read
concurrency:
  group: build-uat
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'mikaelarey/get-it-done.microservice.ebyahe' && github.event.repository.private == true
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'
      - name: Test API
        run: dotnet test EByahe.Tests/EByahe.Tests.csproj -c Release --verbosity minimal
      - name: Publish Windows API
        run: dotnet publish EByahe.Application/EByahe.Application.csproj -c Release -r win-x64 --self-contained false -p:EnvironmentName=UAT -o artifacts/publish
      - name: Package checked release
        run: node deployment/package-release.mjs
      - name: Upload application artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uat-api-ebyahe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/uat-release
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Request central deployment
        env:
          UAT_DEPLOY_DISPATCH_TOKEN: ${{ secrets.UAT_DEPLOY_DISPATCH_TOKEN }}
        run: node deployment/notify-deployment.mjs
